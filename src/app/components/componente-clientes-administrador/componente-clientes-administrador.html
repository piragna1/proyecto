<section>
  <a [routerLink]="'/usuarios-admin'">Volver</a>
  <table>
    <thead>
      <th>Nombre</th>
      <th>Email</th>
      <th>Telefono</th>
    </thead>
    <tbody>
      @for (item of usuarios; track $index) {
        <tr>
          <td>{{ item.nombre }}</td>
          <td>{{ item.email }}</td>
          <td>{{ item.telefono }}</td>
          <td><button>Editar</button></td>
          <td><button>Eliminar</button></td>
        </tr>
      }
    </tbody>
  </table>
</section>
