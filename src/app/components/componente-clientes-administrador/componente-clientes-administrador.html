<section>
  <a class="volver" [routerLink]="'/usuarios-admin'">Volver</a>
  <table>
    <thead>
      <th>Nombre</th>
      <th>Email</th>
      <th>Telefono</th>
    </thead>
    <tbody>
      @for (item of usuarios(); track $index) {
      <tr>
        <td>{{ item.nombre }}</td>
        <td>
          @if (item.email) {
            {{ item.email }}
          } @else {
            <span class="sin-dato">Sin email</span>
          }
        </td>
        <td>{{ item.telefono }}</td>
        <td><button [routerLink]="['/editar-cliente-administrador', item.id]">Editar</button></td>
        <td><button (click)="eliminarUsuario(item.id)">Eliminar</button></td>
      </tr>
      }
    </tbody>
  </table>
</section>
