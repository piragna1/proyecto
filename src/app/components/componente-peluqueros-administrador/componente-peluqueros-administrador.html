<section>
    <a class="volver" [routerLink]="'/usuarios-admin'">Volver</a>
    <div class="table-wrapper">
    <table>
        <thead>
            <th>Nombre</th>
            <th>Email</th>
            <th>Telefono</th>
            <th>Direccion</th>
        </thead>
        <tbody>
            @for (item of peluqueros(); track $index) {
            <tr>
                <td>{{item.nombre}}</td>
                <td>{{item.email}}</td>
                <td>{{item.telefono}}</td>
                <td>{{item.direccion}}</td>
                <td><button [routerLink]="['/editar-peluquero-administrador', item.id]">Editar</button></td>
                <td><button (click)="confirmarEliminacion(item.id, item.nombre)">Eliminar</button></td>
            </tr>
            }
        </tbody>
    </table>
    </div>
    <a class="table-action-link" [routerLink]="'/alta-peluquero'">Agregar peluquero</a>
</section>

<app-confirmar-eliminacion
  [visible]="!!itemAEliminar()"
  [nombreElemento]="itemAEliminar()?.nombre ?? ''"
  [mensaje]="'¿Eliminar peluquero? Esta acción no se puede deshacer.'"
  (confirmar)="ejecutarEliminacion()"
  (cancelar)="cancelarEliminacion()">
</app-confirmar-eliminacion>
