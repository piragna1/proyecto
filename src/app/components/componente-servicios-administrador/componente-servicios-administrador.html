<section>
  <a class="volver" [routerLink]="'/home-admin'">Volver</a>
  <table>
    <thead>
      <th>Tipo</th>
      <th>Precio</th>
    </thead>
    <tbody>
      @for (item of servicios(); track $index) {
      <tr>
        <td>{{ item.tipo }}</td>
        <td>${{ item.precio }}</td>
        <td><button [routerLink]="['/editar-servicio-administrador', item.id]">Editar</button></td>
        <td><button (click)="eliminarServicio(item.id)">Eliminar</button></td>
      </tr>
      }
    </tbody>
    </table>
    <a class="table-action-link" [routerLink]="'/alta-servicio'">Agregar servicio</a>
</section>
