<section class="login-page" [class.saliendo]="saliendo()">
  <div class="login-card">
    <header class="login-header">
      <h1>Bienvenido</h1>
      <p>Ingresá a tu cuenta para gestionar tus turnos</p>
    </header>
    <form [formGroup]="formulario" (ngSubmit)="iniciarSesion()">
      <app-input
        id="email"
        label="Email"
        type="email"
        [control]="formulario.controls.email"
        [error]="hayError('email') ? mensajeCampo('email') : ''"
        placeholder="tu@email.com"
        [required]="true"
        accent="#e8a33d"
      ></app-input>
      <app-input
        id="clave"
        label="Clave"
        type="password"
        [control]="formulario.controls.clave"
        [error]="hayError('clave') ? mensajeCampo('clave') : ''"
        placeholder="••••••••"
        [required]="true"
        accent="#e8a33d"
      ></app-input>
      <app-button type="submit" variant="amber" size="md" class="w-full">
        Iniciar sesión
      </app-button>
      @if (mensajeError()) {
        <p class="error-message" role="alert">{{ mensajeError() }}</p>
      }
      <p class="auth-link">No tienes una cuenta? <a (click)="irARegistro()">Registrate!</a></p>
    </form>
  </div>
</section>
