<section>
  <form action="" [formGroup]="formulario" (ngSubmit)="iniciarSesion()">
    <label for="email">Email: </label>
    <input type="email" name="email" id="email" formControlName="email" />
    <label for="clave">Clave: </label>
    <input type="password" name="clave" id="clave" formControlName="clave" />
    <button type="submit">LogIn</button>
    <p>No tienes una cuenta? <a [routerLink]="'/registro'">Registrate!</a></p>
  </form>
</section>
