<section>
    <a class="volver" [routerLink]="'/home-peluquero'">Volver</a>
    <table>
        <thead>
            <th>Tipo</th>
            <th>Precio</th>
        </thead>
        <tbody>
            @for (item of servicios(); track $index) {
            <tr>
                <td>{{item.tipo}}</td>
                <td>${{item.precio}}</td>
            </tr>
            }
        </tbody>
    </table>
</section>
