<section>
    <a class="volver" [routerLink]="'/administradores-admin'">Volver</a>
    <form [formGroup]="formulario" (ngSubmit)="generarAdministrador()">
        <label for="email">Email: </label>
        <input type="email" name="email" id="email" formControlName="email" [class.invalid]="hayError('email')">
        @if (hayError('email')) {
            <p class="field-error">{{ mensajeCampo('email') }}</p>
        }
        <label for="telefono">Telefono: </label>
        <input type="tel" name="telefono" id="telefono" formControlName="telefono" [class.invalid]="hayError('telefono')">
        @if (hayError('telefono')) {
            <p class="field-error">{{ mensajeCampo('telefono') }}</p>
        }
        <label for="clave">Clave:</label>
        <input type="password" name="clave" id="clave" formControlName="clave" [class.invalid]="hayError('clave')">
        @if (hayError('clave')) {
            <p class="field-error">{{ mensajeCampo('clave') }}</p>
        }
        <button type="submit">Generar administrador</button>
    </form>
</section>
