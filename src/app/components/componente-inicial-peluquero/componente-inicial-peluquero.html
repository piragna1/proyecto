<section [class.saliendo]="saliendo()">
    <header class="encabezado">
        <span class="eyebrow">Tu agenda</span>
        <h2>Hola, {{ usuario() }}</h2>
        <p>Elegí qué querés hacer</p>
    </header>

    <div class="acciones">
        <a class="accion" (click)="navegar('/turnos-peluquero')">
            <span class="icono" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
            </span>
            <span class="titulo">Turnos</span>
            <span class="detalle">Mirá y gestioná tu agenda</span>
            <span class="flecha" aria-hidden="true">→</span>
        </a>
        <a class="accion" (click)="navegar('/clientes-peluquero')">
            <span class="icono" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            </span>
            <span class="titulo">Clientes</span>
            <span class="detalle">Consultá los clientes que atendiste</span>
            <span class="flecha" aria-hidden="true">→</span>
        </a>
        <a class="accion" (click)="navegar('/nuevo-turno-mostrador')">
            <span class="icono" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg>
            </span>
            <span class="titulo">Nuevo turno</span>
            <span class="detalle">Cargá un turno desde el mostrador</span>
            <span class="flecha" aria-hidden="true">→</span>
        </a>
        <a class="accion" (click)="navegar('/servicios-peluquero')">
            <span class="icono" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.12 15.88M14.47 14.48 20 20M8.12 8.12 12 12"/></svg>
            </span>
            <span class="titulo">Servicios</span>
            <span class="detalle">Tus servicios y sus precios</span>
            <span class="flecha" aria-hidden="true">→</span>
        </a>
        <button type="button" class="accion" (click)="irAPerfil()">
            <span class="icono" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </span>
            <span class="titulo">Mi perfil</span>
            <span class="detalle">Actualizá tus datos y tu clave</span>
            <span class="flecha" aria-hidden="true">→</span>
        </button>
    </div>
</section>
