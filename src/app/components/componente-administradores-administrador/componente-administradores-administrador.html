<section>
    <a class="volver" [routerLink]="'/usuarios-admin'">Volver</a>
    <div class="table-wrapper">
    <table>
        <thead>
            <th>Email</th>
            <th>Clave</th>
        </thead>
        <tbody>
            @for (item of administradores(); track $index) {
            <tr>
                <td>{{item.email}}</td>
                <td>{{item.clave}}</td>
                <td><button [routerLink]="['/editar-administrador',item.id]">Editar</button></td>
                <td><button (click)="confirmarEliminacion(item.id, item.email)">Eliminar</button></td>
            </tr>
            }
        </tbody>
    </table>
    </div>
    <a class="action-link" [routerLink]="'/alta-administrador'">Agregar administrador</a>
</section>

<app-confirmar-eliminacion
  [visible]="!!itemAEliminar()"
  [nombreElemento]="itemAEliminar()?.nombre ?? ''"
  [mensaje]="'¿Eliminar administrador? Esta acción no se puede deshacer.'"
  (confirmar)="ejecutarEliminacion()"
  (cancelar)="cancelarEliminacion()">
</app-confirmar-eliminacion>
