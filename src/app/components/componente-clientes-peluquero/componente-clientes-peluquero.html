<section>
    <a [routerLink]="'/home-peluquero'">Volver</a>
    <table>
        <thead>
            <th>Nombre</th>
            <th>Email</th>
            <th>Telefono</th>
        </thead>
        <tbody>
            @for (item of clientes(); track $index) {
            <tr>
                <td>{{item.nombre}}</td>
                <td>{{item.email}}</td>
                <td>{{item.telefono}}</td>
            </tr>
            }
        </tbody>
    </table>
</section>
