<section>
  <h2>Nuevo turno (mostrador):</h2>
  <form (ngSubmit)="generarTurno()" [formGroup]="formulario">
    <label for="servicio">Servicio</label>
    <select name="servicio" id="servicio" formControlName="servicio">
      @for (item of servicios(); track $index) {
      <option [ngValue]="item">{{ item.tipo }}</option>
      }
    </select>
    <label for="horario">Horario: </label>
    <input type="datetime-local" name="horario" id="horario" formControlName="fechaHoraInicio" />
    <label for="nombre">Nombre del cliente: </label>
    <input type="text" name="nombre" id="nombre" formControlName="nombre" />
    <label for="telefono">Teléfono: </label>
    <input type="tel" name="telefono" id="telefono" formControlName="telefono" />
    <button type="submit">Solicitar turno</button>
  </form>
</section>
